name: Build & deploy to GitHub Pages

# OPTIONAL. The default way this repo publishes Pages is "Deploy from a branch"
# with the prebuilt site committed at the repo root (index.html + /play). This
# workflow is an alternative that rebuilds the WASM from source on demand.
#
# To use it instead: Settings -> Pages -> Source = "GitHub Actions", then run
# this workflow manually (Actions tab -> Run workflow). It is manual-only so it
# never conflicts with the branch-based deployment.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Build raylib (web target)
        run: |
          # Pin raylib to a release known-compatible with the emsdk above.
          git clone --depth 1 --branch 5.0 https://github.com/raysan5/raylib
          make -C raylib/src PLATFORM=PLATFORM_WEB -j"$(nproc)"

      - name: Build game (WebAssembly)
        run: |
          mkdir -p _site/play
          cd src
          emcc -std=c2x main.c game.c -o "$GITHUB_WORKSPACE/_site/play/index.html" \
            -I"$GITHUB_WORKSPACE/raylib/src" "$GITHUB_WORKSPACE/raylib/src/libraylib.web.a" \
            -DPLATFORM_WEB -s USE_GLFW=3 -s ASYNCIFY -s ALLOW_MEMORY_GROWTH=1 \
            --shell-file web/shell.html

      - name: Assemble site (landing page + build)
        run: cp index.html .nojekyll _site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
