name: Build WASM & Deploy to GitHub Pages

# Builds the C23 + raylib reimplementation to WebAssembly with emscripten and
# publishes the playable build to GitHub Pages. Replaces the old "commit the
# prebuilt blob into play/" flow — the live site is now built from source on push.

on:
  push:
    branches: [claude/klad-reverse-engineering-5sIe0]
    paths:
      - 'src/**'
      - 'font/**'
      - 'index.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Least-privilege token for the Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent Pages deploy; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  EMSDK_VERSION: '3.1.64'
  RAYLIB_REF: '5.5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Build raylib for web
        run: |
          git clone --depth 1 --branch "${RAYLIB_REF}" https://github.com/raysan5/raylib.git raylib
          make -C raylib/src PLATFORM=PLATFORM_WEB -B
          # raylib 5.5's web build emits libraylib.a (wasm objects), not libraylib.web.a.
          test -f raylib/src/libraylib.a

      - name: Build КЛАД to WebAssembly
        run: |
          make -C src web \
            RAYLIB_SRC="${GITHUB_WORKSPACE}/raylib/src" \
            RAYLIB_WEB="${GITHUB_WORKSPACE}/raylib/src/libraylib.a"

      - name: Assemble Pages site
        run: |
          mkdir -p _site/play
          cp index.html _site/index.html
          cp build/web/index.* _site/play/
          ls -la _site _site/play

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
