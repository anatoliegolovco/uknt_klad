<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Klad-Reimagined — КЛАД 1987 (Баранов), УКНЦ МС-0511</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-family:system-ui,sans-serif;color:#ccc;touch-action:none;}
  /* Centre the game both axes; the engine letterboxes its content in blue, so
     the canvas box just needs to fit the viewport. Crisp retro pixels. */
  canvas{image-rendering:pixelated;display:block;outline:none;
    width:min(100vw, 133.333vh);   /* 4/3 of the viewport height */
    height:auto;max-height:100vh;aspect-ratio:4 / 3;}

  /* Portrait phones: the game is wide, so a portrait viewport leaves it a tiny
     band. Rotate it 90° to landscape and fill the screen. Touch is remapped in
     JS (below) to match the rotated view. */
  @media (orientation:portrait){
    /* position:fixed takes the canvas out of flex flow so it can't be shrunk;
       size it to the rotated viewport (w=100vh, h=100vw) and centre+rotate. */
    canvas{position:fixed;top:50%;left:50%;
      width:100vh;height:100vw;max-height:none;aspect-ratio:auto;
      transform:translate(-50%,-50%) rotate(90deg);transform-origin:center;}
  }
  #note{position:fixed;bottom:6px;left:0;right:0;text-align:center;
    font-size:12px;opacity:.55;pointer-events:none;z-index:2;}
  #note a{color:#f0d23c;pointer-events:auto;text-decoration:none;}
</style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="note">Arrows / WASD · tap to start, tap edges to move ·
    <a href="https://github.com/anatoliegolovco/uknt_klad" target="_blank" rel="noopener">source on GitHub</a></div>
  <script>
    var Module = {
      canvas: (function () { return document.getElementById('canvas'); })(),
      print: function (t) { console.log(t); },
      printErr: function (t) { console.error(t); },
    };

    // ── Touch controls, rotation-aware ──────────────────────────────────────
    // CSS rotation breaks raylib's GetTouchPosition() edge mapping, so the shell
    // owns touch: it suppresses the browser touch from emscripten (capture-phase
    // stopImmediatePropagation) and dispatches arrow-key events instead. Zones
    // are computed in screen space and rotated when the portrait media query is
    // active, so "tap the visual edge" always maps to the right direction.
    (function () {
      var KEYCODE = { ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, Enter: 13 };
      var held = {};
      function send(type, code) {
        var ev = { key: code, code: code, keyCode: KEYCODE[code], which: KEYCODE[code],
                   bubbles: true, cancelable: true };
        document.dispatchEvent(new KeyboardEvent(type, ev));
        window.dispatchEvent(new KeyboardEvent(type, ev));
      }
      function apply(active) {
        ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].forEach(function (code) {
          if (active[code] && !held[code]) { send('keydown', code); held[code] = true; }
          else if (!active[code] && held[code]) { send('keyup', code); held[code] = false; }
        });
      }
      function portrait() { return matchMedia('(orientation: portrait)').matches; }
      function zones(x, y) {
        var nx = x / window.innerWidth, ny = y / window.innerHeight, a = {};
        if (portrait()) {
          // canvas rotated 90° CW: screen-down→right, screen-up→left,
          // screen-left→down, screen-right→up.
          if (ny > 0.6) a.ArrowRight = 1; else if (ny < 0.4) a.ArrowLeft = 1;
          if (nx < 0.4) a.ArrowDown  = 1; else if (nx > 0.6) a.ArrowUp   = 1;
        } else {
          if (nx < 1 / 3) a.ArrowLeft = 1; else if (nx > 2 / 3) a.ArrowRight = 1;
          if (ny < 1 / 4) a.ArrowUp   = 1; else if (ny > 3 / 4) a.ArrowDown  = 1;
        }
        return a;
      }
      function onTouch(e) {
        e.preventDefault();
        e.stopImmediatePropagation();   // keep emscripten from also reading it
        if (e.type === 'touchend' || e.type === 'touchcancel') {
          if (e.touches.length === 0) {
            apply({});
            if (held.Enter) { send('keyup', 'Enter'); held.Enter = false; }
          }
          return;
        }
        // A tap = the "action" key (Enter): starts the title / speed screens and
        // restarts after game over — so the game is fully playable with no keyboard.
        if (e.type === 'touchstart' && !held.Enter) { send('keydown', 'Enter'); held.Enter = true; }
        var t = e.touches[0];
        apply(zones(t.clientX, t.clientY));
      }
      ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (t) {
        window.addEventListener(t, onTouch, { capture: true, passive: false });
      });
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
