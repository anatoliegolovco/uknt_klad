<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Klad-Reimagined — КЛАД 1987 (Баранов), УКНЦ МС-0511</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-family:system-ui,sans-serif;color:#ccc;
    touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  /* Centre the game both axes; the engine letterboxes its content in blue, so
     the canvas box just needs to fit the viewport. Crisp retro pixels. */
  canvas{image-rendering:pixelated;display:block;outline:none;
    width:min(100vw, 133.333vh);   /* 4/3 of the viewport height */
    height:auto;max-height:100vh;aspect-ratio:4 / 3;}

  /* Portrait phones: the game is wide, so a portrait viewport leaves it a tiny
     band. Rotate it 90° to landscape and fill the screen. The touch zones below
     are remapped to match the rotated view. */
  @media (orientation:portrait){
    canvas{position:fixed;top:50%;left:50%;
      width:100vh;height:100vw;max-height:none;aspect-ratio:auto;
      transform:translate(-50%,-50%) rotate(90deg);transform-origin:center;}
  }
  #note{position:fixed;bottom:6px;left:0;right:0;text-align:center;
    font-size:12px;opacity:.55;pointer-events:none;z-index:2;}
  #note a{color:#f0d23c;pointer-events:auto;text-decoration:none;}
  /* Restart-level button (anti-soft-lock): КЛАД has no jump, so a few dead-end
     pockets can't be escaped or died-out-of. This reloads the current level. */
  #restart{position:fixed;top:8px;right:10px;z-index:5;width:38px;height:38px;
    border-radius:50%;border:1px solid rgba(240,210,60,.5);background:rgba(0,0,30,.4);
    color:#f0d23c;font-size:20px;line-height:36px;text-align:center;cursor:pointer;opacity:.6;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
</style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="restart" title="Restart level (R)">⟲</div>
  <div id="note">Tap left / right to move · top / bottom for ladders · tap centre to start · ⟲ / R = restart · keyboard: arrows / WASD ·
    <a href="https://github.com/anatoliegolovco/uknt_klad" target="_blank" rel="noopener">source on GitHub</a></div>
  <script>
    var Module = {
      canvas: (function () { return document.getElementById('canvas'); })(),
      print: function (t) { console.log(t); },
      printErr: function (t) { console.error(t); },
      // Cache-bust the wasm per deploy (CI injects the build SHA into __KLAD_VER__) so a
      // stale index.wasm never lingers behind an updated page.
      locateFile: function (path, prefix) {
        return prefix + path + (path.slice(-5) === '.wasm' ? '?v=__KLAD_VER__' : '');
      },
    };

    // ── Touch controls: tap/hold a screen EDGE to move ──────────────────────────
    // Left/right thirds = move left/right; top/bottom quarters = up/down (ladders);
    // centre = the action key (start title, confirm speed, restart after game over).
    // The shell dispatches keyboard events (raylib's own touch mapping breaks under the
    // portrait CSS rotation), and the zones are remapped when rotated so the visual edge
    // always matches the direction.
    (function () {
      var KEYCODE = { ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, Enter: 13 };
      var held = {};
      function send(type, code) {
        var ev = { key: code, code: code, keyCode: KEYCODE[code], which: KEYCODE[code],
                   bubbles: true, cancelable: true };
        document.dispatchEvent(new KeyboardEvent(type, ev));
        window.dispatchEvent(new KeyboardEvent(type, ev));
      }
      function apply(active) {
        ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].forEach(function (code) {
          if (active[code] && !held[code]) { send('keydown', code); held[code] = true; }
          else if (!active[code] && held[code]) { send('keyup', code); held[code] = false; }
        });
      }
      function portrait() { return matchMedia('(orientation: portrait)').matches; }
      function zones(x, y) {
        var nx = x / window.innerWidth, ny = y / window.innerHeight, a = {};
        if (portrait()) {
          // canvas rotated 90° CW: screen-down→right, screen-up→left,
          // screen-left→down, screen-right→up.
          if (ny > 0.6) a.ArrowRight = 1; else if (ny < 0.4) a.ArrowLeft = 1;
          if (nx < 0.4) a.ArrowDown  = 1; else if (nx > 0.6) a.ArrowUp   = 1;
        } else {
          if (nx < 1 / 3) a.ArrowLeft = 1; else if (nx > 2 / 3) a.ArrowRight = 1;
          if (ny < 1 / 4) a.ArrowUp   = 1; else if (ny > 3 / 4) a.ArrowDown  = 1;
        }
        return a;
      }
      function releaseEnter() { if (held.Enter) { send('keyup', 'Enter'); held.Enter = false; } }
      function update(x, y) {
        var z = zones(x, y);
        var center = !z.ArrowLeft && !z.ArrowRight && !z.ArrowUp && !z.ArrowDown;
        apply(z);
        if (center && !held.Enter) { send('keydown', 'Enter'); held.Enter = true; }
        else if (!center) releaseEnter();
      }
      function onTouch(e) {
        e.preventDefault();                       // stop browser scroll / chrome (stay fullscreen)
        if (e.target && e.target.id === 'restart') return;   // restart button handles its own tap
        e.stopImmediatePropagation();             // keep emscripten from also reading it
        if (e.type === 'touchend' || e.type === 'touchcancel') {
          if (e.touches.length === 0) { apply({}); releaseEnter(); }
          return;
        }
        var t = e.touches[0];
        update(t.clientX, t.clientY);
      }
      ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (t) {
        window.addEventListener(t, onTouch, { capture: true, passive: false });
      });

      // Restart-level button → inject 'R' (KEY_R = 82). Works on touch and mouse.
      var rb = document.getElementById('restart');
      function doRestart(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        var ev = { key: 'r', code: 'KeyR', keyCode: 82, which: 82, bubbles: true, cancelable: true };
        document.dispatchEvent(new KeyboardEvent('keydown', ev));
        window.dispatchEvent(new KeyboardEvent('keydown', ev));
        setTimeout(function () {
          document.dispatchEvent(new KeyboardEvent('keyup', ev));
          window.dispatchEvent(new KeyboardEvent('keyup', ev));
        }, 60);
      }
      rb.addEventListener('touchstart', doRestart, { passive: false });
      rb.addEventListener('click', doRestart);
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
