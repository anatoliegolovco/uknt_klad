<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Klad-Reimagined — КЛАД 1987 (Баранов), УКНЦ МС-0511</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-family:system-ui,sans-serif;color:#ccc;touch-action:none;}
  /* Centre the game both axes; the engine letterboxes its content in blue, so
     the canvas box just needs to fit the viewport. Crisp retro pixels. */
  canvas{image-rendering:pixelated;display:block;outline:none;
    width:min(100vw, 133.333vh);   /* 4/3 of the viewport height */
    height:auto;max-height:100vh;aspect-ratio:4 / 3;}

  /* Portrait phones: the game is wide, so a portrait viewport leaves it a tiny
     band. Rotate it 90° to landscape and fill the screen. The D-pad below maps
     each button to the rotated visual direction. */
  @media (orientation:portrait){
    canvas{position:fixed;top:50%;left:50%;
      width:100vh;height:100vw;max-height:none;aspect-ratio:auto;
      transform:translate(-50%,-50%) rotate(90deg);transform-origin:center;}
  }
  #note{position:fixed;bottom:6px;left:0;right:0;text-align:center;
    font-size:12px;opacity:.55;pointer-events:none;z-index:2;}
  #note a{color:#f0d23c;pointer-events:auto;text-decoration:none;}
  /* Restart-level button (anti-soft-lock): КЛАД has no jump, so a few dead-end
     pockets can't be escaped or died-out-of. This reloads the current level. */
  #restart{position:fixed;top:8px;right:10px;z-index:5;width:40px;height:40px;
    border-radius:50%;border:1px solid #f0d23c;background:rgba(0,0,30,.55);
    color:#f0d23c;font-size:22px;line-height:38px;text-align:center;cursor:pointer;
    -webkit-tap-highlight-color:transparent;user-select:none;}

  /* Minecraft-style on-screen D-pad — drawn over the game, bottom-left.
     Touch devices only (keyboard is used on desktop). */
  #dpad{position:fixed;left:18px;bottom:20px;z-index:4;width:156px;height:156px;
    display:none;touch-action:none;user-select:none;}
  @media (pointer:coarse){ #dpad{display:block} }
  .dbtn{position:absolute;width:50px;height:50px;border-radius:12px;
    background:rgba(8,8,36,.40);border:2px solid rgba(240,210,60,.85);color:#f0d23c;
    font:24px/46px system-ui,sans-serif;text-align:center;
    -webkit-tap-highlight-color:transparent;user-select:none;}
  .dbtn.act{background:rgba(240,210,60,.5);color:#101000;}
  .dbtn.up{left:53px;top:0}      .dbtn.down{left:53px;bottom:0}
  .dbtn.left{left:0;top:53px}    .dbtn.right{right:0;top:53px}
</style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="restart" title="Restart level (R)">⟲</div>
  <div id="dpad" aria-hidden="true">
    <div class="dbtn up"    data-dir="u">▲</div>
    <div class="dbtn left"  data-dir="l">◀</div>
    <div class="dbtn right" data-dir="r">▶</div>
    <div class="dbtn down"  data-dir="d">▼</div>
  </div>
  <div id="note">D-pad to move · tap the game to start / confirm · ⟲ / R = restart · keyboard: arrows / WASD ·
    <a href="https://github.com/anatoliegolovco/uknt_klad" target="_blank" rel="noopener">source on GitHub</a></div>
  <script>
    var Module = {
      canvas: (function () { return document.getElementById('canvas'); })(),
      print: function (t) { console.log(t); },
      printErr: function (t) { console.error(t); },
    };

    // ── Touch controls ──────────────────────────────────────────────────────
    // The shell owns touch and dispatches keyboard events (raylib's own touch
    // mapping breaks under the portrait CSS rotation). An on-screen D-pad drives
    // movement; a tap on the game area is the action key (Enter) for the title /
    // speed / game-over screens.
    (function () {
      var KEYCODE = { ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, Enter: 13 };
      var held = {};
      function send(type, code) {
        var ev = { key: code, code: code, keyCode: KEYCODE[code], which: KEYCODE[code],
                   bubbles: true, cancelable: true };
        document.dispatchEvent(new KeyboardEvent(type, ev));
        window.dispatchEvent(new KeyboardEvent(type, ev));
      }
      function portrait() { return matchMedia('(orientation: portrait)').matches; }
      function releaseEnter() { if (held.Enter) { send('keyup', 'Enter'); held.Enter = false; } }

      // D-pad: each button → the arrow key that moves the player in the VISUAL
      // direction. In portrait the canvas is rotated 90° CW, so remap accordingly.
      function dirKey(dir) {
        var land = { u: 'ArrowUp',   d: 'ArrowDown',  l: 'ArrowLeft', r: 'ArrowRight' };
        var port = { u: 'ArrowLeft', d: 'ArrowRight', l: 'ArrowDown', r: 'ArrowUp'    };
        return (portrait() ? port : land)[dir];
      }
      Array.prototype.forEach.call(document.querySelectorAll('#dpad .dbtn'), function (btn) {
        var dir = btn.getAttribute('data-dir'), active = null;
        function down(e) {
          e.preventDefault(); e.stopPropagation();
          var k = dirKey(dir);
          if (active && active !== k) { send('keyup', active); held[active] = false; }
          if (!held[k]) { send('keydown', k); held[k] = true; }
          active = k; btn.classList.add('act');
        }
        function up(e) {
          if (e) e.preventDefault();
          if (active) { send('keyup', active); held[active] = false; active = null; }
          btn.classList.remove('act');
        }
        btn.addEventListener('touchstart', down, { passive: false });
        btn.addEventListener('touchend',   up,   { passive: false });
        btn.addEventListener('touchcancel',up,   { passive: false });
        btn.addEventListener('mousedown',  down);
        btn.addEventListener('mouseup',    up);
        btn.addEventListener('mouseleave', up);
      });

      // Tap the game area = action key (Enter). Skip taps on the D-pad / restart.
      function onTouch(e) {
        if (e.target && e.target.closest && (e.target.closest('#dpad') || e.target.id === 'restart')) return;
        e.preventDefault();
        e.stopImmediatePropagation();   // keep emscripten from also reading it
        if (e.type === 'touchend' || e.type === 'touchcancel') {
          if (e.touches.length === 0) releaseEnter();
          return;
        }
        if (!held.Enter) { send('keydown', 'Enter'); held.Enter = true; }
      }
      ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (t) {
        window.addEventListener(t, onTouch, { capture: true, passive: false });
      });

      // Restart-level button → inject 'R' (KEY_R = 82). Works on touch and mouse.
      var rb = document.getElementById('restart');
      function doRestart(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        var ev = { key: 'r', code: 'KeyR', keyCode: 82, which: 82, bubbles: true, cancelable: true };
        document.dispatchEvent(new KeyboardEvent('keydown', ev));
        window.dispatchEvent(new KeyboardEvent('keydown', ev));
        setTimeout(function () {
          document.dispatchEvent(new KeyboardEvent('keyup', ev));
          window.dispatchEvent(new KeyboardEvent('keyup', ev));
        }, 60);
      }
      rb.addEventListener('touchstart', doRestart, { passive: false });
      rb.addEventListener('click', doRestart);
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
